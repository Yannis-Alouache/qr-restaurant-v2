name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run API tests
        run: cd api && mvn -q test

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install dependencies
        run: cd ${{ matrix.app }} && npm ci
      - name: Run tests
        run: cd ${{ matrix.app }} && npm test -- --watch=false
      - name: Build app
        run: cd ${{ matrix.app }} && npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json
            client/package-lock.json
      - name: Install root e2e dependencies
        run: npm ci
      - name: Install admin dependencies
        run: cd admin && npm ci
      - name: Install client dependencies
        run: cd client && npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL and Mailpit
        # --wait : rend la main seulement quand postgres a passé son
        # healthcheck (TCP, donc serveur réel — voir docker-compose.yml).
        run: docker compose -f docker/docker-compose.yml up -d --wait postgres mailpit
      - name: Run browser e2e
        run: npm run test:e2e
        env:
          # Le seed de démo est désactivé par défaut (V2 gated) : les scénarios
          # e2e naviguent sur naia-burger, il doit donc être actif ici.
          SEED_DEMO_DATA: "true"

  deploy:
    # Déclenche le déploiement Coolify (git-push) après une CI verte sur main.
    # Récupérez l'URL « Deploy Trigger » dans l'UI Coolify (onglet Webhook de
    # la ressource) et enregistrez-la comme secret COOLIFY_DEPLOY_WEBHOOK.
    # Sans ce secret, le job ne fait rien : la CI reste verte sans déploiement.
    needs: [api, frontend, browser-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK non configuré : déploiement ignoré."
            exit 0
          fi
          curl -fsS --max-time 30 -X POST "$WEBHOOK"
          echo "Déploiement Coolify déclenché."
