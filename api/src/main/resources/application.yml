server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qr_restaurant}
    username: ${POSTGRES_USER:qr_user}
    password: ${POSTGRES_PASSWORD:qr_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 4
    baseline-description: legacy-safe-baseline
    clean-disabled: true
    # Le seed de démo (V2) n'insère ses données que si ce placeholder vaut
    # "true" — activé explicitement en local via SEED_DEMO_DATA=true dans .env
    # (et forcé dans les tests). Défaut false : une base de prod vierge reste
    # vierge de tout compte de démo.
    placeholders:
      seed_demo_data: ${SEED_DEMO_DATA:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  public-key: ${STRIPE_PUBLIC_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Identifiant we_... de l'endpoint dashboard : active le contrôle de version au démarrage.
  webhook-endpoint-id: ${STRIPE_WEBHOOK_ENDPOINT_ID:}

storage:
  seaweedfs:
    s3-endpoint: ${SEAWEEDFS_S3_ENDPOINT:http://localhost:8333}

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LWp3dC1zZWNyZXQta2V5LWZvci1xci1yZXN0YXVyYW50LXYy}
  expiration: 2592000000 # 30 jours (par défaut = dev). Override prod ci-dessous.
  cookie:
    secure: ${JWT_COOKIE_SECURE:false} # true en production (HTTPS uniquement)
    same-site: Lax

app:
  client-base-url: ${CLIENT_BASE_URL:http://localhost:4300}
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:4200}
  cors:
    # Patterns d'origines additionnels (séparés par des virgules). Par défaut en dev :
    # les tunnels trycloudflare (sous-domaine aléatoire à chaque lancement) pour tester
    # depuis un appareil extérieur. Vide en prod — y ajouter les origines réelles.
    extra-origin-patterns: ${CORS_EXTRA_ORIGIN_PATTERNS:https://*.trycloudflare.com}

---
spring:
  config:
    activate:
      on-profile: prod
app:
  cors:
    extra-origin-patterns: ${CORS_EXTRA_ORIGIN_PATTERNS:}
jwt:
  # Pas de valeur par défaut en prod : sans JWT_SECRET, le démarrage échoue
  # (fail-fast) au lieu de signer les tokens avec le secret de dev committed.
  secret: ${JWT_SECRET}
  expiration: 604800000 # 7 jours en production
  cookie:
    secure: ${JWT_COOKIE_SECURE:true} # HTTPS uniquement par défaut en prod
