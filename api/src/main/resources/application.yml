server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qr_restaurant}
    username: ${POSTGRES_USER:qr_user}
    password: ${POSTGRES_PASSWORD:qr_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 4
    baseline-description: legacy-safe-baseline
    clean-disabled: true
    # Le seed de démo (V2) n'insère ses données que si ce placeholder vaut
    # "true" — activé explicitement en local via SEED_DEMO_DATA=true dans .env
    # (et forcé dans les tests). Défaut false : une base de prod vierge reste
    # vierge de tout compte de démo.
    placeholders:
      seed_demo_data: ${SEED_DEMO_DATA:false}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    # Défaut local = Mailpit du docker-compose (docker/mailpit: UI sur :8025).
    # En prod, MAIL_HOST est obligatoire (voir profil prod ci-dessous).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        # Identités EHLO et domaine du Message-ID fixées : sans elles, Jakarta
        # Mail résout le hostname de la machine par DNS à CHAQUE envoi, ce qui
        # coûte 10-20 s sur les postes dont la résolution traîne (Windows).
        host: ${MAIL_SMTP_EHLO_NAME:qr-restaurant-api}
        smtp:
          localhost: ${MAIL_SMTP_EHLO_NAME:qr-restaurant-api}
          # Échouer vite plutôt que laisser le thread requête bloqué des minutes
          # sur un SMTP injoignable.
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 5000
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        # Seuls health et info sont exposés : pas de métriques détaillées ni
        # d'arrêt distant publiquement accessibles.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.qrrestaurant: INFO

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  public-key: ${STRIPE_PUBLIC_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # Identifiant we_... de l'endpoint dashboard : active le contrôle de version au démarrage.
  webhook-endpoint-id: ${STRIPE_WEBHOOK_ENDPOINT_ID:}

storage:
  seaweedfs:
    s3-endpoint: ${SEAWEEDFS_S3_ENDPOINT:http://localhost:8333}
  upload:
    # Limite par fichier (au-delà de la limite multipart servlet globale de 10 Mo)
    max-file-size-bytes: 5242880 # 5 Mo
    # Quota cumulé par compte restaurateur
    quota-bytes-by-owner: 104857600 # 100 Mo

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldmVsb3BtZW50LWp3dC1zZWNyZXQta2V5LWZvci1xci1yZXN0YXVyYW50LXYy}
  expiration: 2592000000 # 30 jours (par défaut = dev). Override prod ci-dessous.
  cookie:
    secure: ${JWT_COOKIE_SECURE:false} # true en production (HTTPS uniquement)
    same-site: Lax

app:
  client-base-url: ${CLIENT_BASE_URL:http://localhost:4300}
  admin-base-url: ${ADMIN_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:Menzo <no-reply@qr-restaurant.local>}
    # Développement sans SMTP joignable : journalise le lien de reset en cas
    # d'échec d'envoi, pour pouvoir finir le parcours. Toujours false en prod
    # (un lien dans des logs = détournement de compte possible).
    log-reset-links-on-failure: ${MAIL_LOG_RESET_LINKS:true}
  password-reset:
    # Durée de validité du lien reçu par email.
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:60}
  cors:
    # Patterns d'origines additionnels (séparés par des virgules). Par défaut en dev :
    # les tunnels trycloudflare (sous-domaine aléatoire à chaque lancement) pour tester
    # depuis un appareil extérieur. Vide en prod — y ajouter les origines réelles.
    extra-origin-patterns: ${CORS_EXTRA_ORIGIN_PATTERNS:https://*.trycloudflare.com}

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    # Pas de valeur par défaut en prod : sans SMTP configuré, le démarrage
    # échoue (fail-fast) plutôt que de livrer un « mot de passe oublié » muet.
    host: ${MAIL_HOST}
management:
  health:
    mail:
      # Le statut global de l'API ne doit pas dépendre du relais SMTP : une
      # panne e-mail dégrade « mot de passe oublié », pas les commandes. Les
      # échecs d'envoi restent journalisés par le service de mail.
      enabled: false
app:
  mail:
    log-reset-links-on-failure: ${MAIL_LOG_RESET_LINKS:false}
  cors:
    extra-origin-patterns: ${CORS_EXTRA_ORIGIN_PATTERNS:}
jwt:
  # Pas de valeur par défaut en prod : sans JWT_SECRET, le démarrage échoue
  # (fail-fast) au lieu de signer les tokens avec le secret de dev committed.
  secret: ${JWT_SECRET}
  expiration: 604800000 # 7 jours en production
  cookie:
    secure: ${JWT_COOKIE_SECURE:true} # HTTPS uniquement par défaut en prod
