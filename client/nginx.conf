# Back-office Angular servi par nginx, avec l'API proxifiée en same-origin.
# Les cookies JWT (SameSite=Lax) et les appels relatifs du SPA (/api, /ws)
# fonctionnent donc sans CORS ; seul ce conteneur est exposé publiquement,
# l'API reste joignable par lui et par Traefik/Coolify.

# Gestion de la bascule WebSocket : Connection: upgrade seulement quand le
# client le demande (SockJS commence par des requêtes HTTP pures).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Le vrai client est derrière Traefik (Coolify). Ces directives rétablissent
# $remote_addr à partir du X-Forwarded-For construit par Traefik (le saut
# Traefik est de confiance : réseau Docker interne), et on ne transmet plus à
# l'API qu'une seule IP vérifiée. Le RateLimitingFilter de l'API prenant la
# première entrée de X-Forwarded-For, lui laisser la chaîne d'origine permettrait
# de contourner la limitation en forgeant l'en-tête.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Santé du conteneur (HEALTHCHECK du Dockerfile, sondes Coolify).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # API métier : proxifiée telle quelle (le SPA appelle /api/...).
    # 12 Mo = limite d'upload de l'API (10 Mo) + marge multipart.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    # SockJS /ws : requêtes HTTP (info, xhr) puis bascule WebSocket.
    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une cuisine reste ouverte des heures : ne pas couper la connexion idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # index.html jamais mis en cache : un déploiement est servi immédiatement.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Assets fingerprintés par Angular (outputHashing=all) : cache long.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA : toute route inconnue sert l'application (routage côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
