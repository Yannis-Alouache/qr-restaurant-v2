<div class="cart-bar">
  <div class="cart-bar-inner" (click)="openCart.emit()">
    <div class="cart-icon-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <path d="M16 10a4 4 0 01-8 0"></path>
      </svg>
      <span class="cart-badge">{{ cart.itemCount() }}</span>
    </div>
    <div class="cart-total">
      <span class="cart-total-amount">{{ cart.total() | price }}</span>
      <span class="cart-total-label">panier</span>
    </div>
    <button class="cart-btn" type="button" (click)="openCart.emit(); $event.stopPropagation()">
      Voir panier
    </button>
  </div>
</div>
