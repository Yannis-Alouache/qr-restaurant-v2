<div class="app cancellation">
  <div class="cancellation-card">

    <div class="cancel-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    </div>

    <h1 class="page-title">Paiement annulé</h1>
    <p class="page-subtitle">
      Votre paiement n'a pas été finalisé. Votre commande est conservée et vous pouvez relancer le paiement.
    </p>

    @if (error()) {
      <p class="error-text">{{ error() }}</p>
    }

    <div class="actions">
      <button class="action-btn action-btn--primary" type="button" [disabled]="retrying()" (click)="retryPayment()">
        @if (retrying()) {
          Traitement…
        } @else {
          Réessayer le paiement
        }
      </button>
      <button class="action-btn" type="button" (click)="goBack()">Retour au menu</button>
    </div>

  </div>
</div>
