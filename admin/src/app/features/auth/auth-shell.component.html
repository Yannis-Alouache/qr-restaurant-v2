<div class="auth-shell">

  <!-- Left panel — brand -->
  <aside class="auth-brand">
    <div class="brand-content">
      <div class="brand-logo"><span>Menzo</span></div>
      <ng-content select="[brandBody]"></ng-content>
    </div>
  </aside>

  <!-- Right panel — form -->
  <main class="auth-form-panel">
    <div class="form-wrapper">
      <div class="mobile-brand"><span>Menzo</span></div>
      <ng-content></ng-content>
      <footer class="auth-legal-footer">
        <a routerLink="/mentions-legales">Mentions légales</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/terms">CGU</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/privacy">Confidentialité</a>
      </footer>
    </div>
  </main>

</div>
